<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جوكر عربي</title><link rel="stylesheet" href="app.css"></head><body style="margin:0;background:#1b2a4e"><div id="ja-root" dir="rtl"><p style="color:#fff;font:20px sans-serif;text-align:center;padding:40px">جاري التحميل...</p></div><script>
(async()=>{const P=["p1.txt", "p2.txt", "p3.txt", "p4.txt", "p5.txt", "p6.txt", "p7.txt", "p8.txt", "p9.txt", "p10.txt"];const t=await Promise.all(P.map(f=>fetch(f).then(r=>r.text()).then(x=>x.replace(/\n$/,""))));const b=new Blob([t.join("")],{type:"text/javascript"});const s=document.createElement("script");s.src=URL.createObjectURL(b);document.body.appendChild(s)})();
</script></body></html>
